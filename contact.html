<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Contact page for my personal website." />
    <meta name="author" content="Logan Gillett" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-control" content="public" />
    <title>Contact - Logan Gillett</title>
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/formatting.css" />
    <link rel="icon" href="resources/websiteLogo.jpg" type="image/x-icon" />
    <script src="jquery-3.7.1.js"></script>
    <script src="js/common.js"></script>
    <script>
      // Contact form specific functions
      function clearFields() {
        document.getElementById("first-name").value = "";
        document.getElementById("last-name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("subject").value = "";
        document.getElementById("message").value = "";
      }
    </script>
    <style>
      .header-container {
        background-image: url(resources/forestFog3.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: top center;
      }

      .main-contact {
        background-image: url(resources/norwayGray.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: top center;
      }

      body {
        background-image: url(resources/back.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: top center;
        background-attachment: fixed;
      }
    </style>
  </head>

  <body>
    <div id="background-img">
      <div id="wrap">
        <header id="header-placeholder">
          <!-- Header will be loaded here -->
        </header>

        <!-- Main Content -->
        <main>
          <div class="main-contact">
            <div class="elem main-header-element">
              <br />
              <h2>Let's Create Something Together</h2>
            </div>
            <form
              class="main-contact-form"
              action="https://api.web3forms.com/submit"
              method="POST"
            >
              <input
                type="hidden"
                name="access_key"
                value="3cffb038-0f16-4caf-9677-ff9d5d4e9976"
              />
              <div class="contact-form">
                <span class="elem">Name</span>
                <span class="elem info-required">(required)</span>
                <div class="name-input">
                  <p class="elem">
                    <label for="first-name">First Name</label><br />
                    <input
                      type="text"
                      name="first-name"
                      id="first-name"
                      required
                    />
                  </p>
                  <p class="elem">
                    <label for="last-name">Last Name</label><br />
                    <input type="text" name="last-name" id="last-name" required />
                  </p>
                </div>
                <div class="email-input">
                  <p class="elem">
                    <label for="email"
                      >Email <span class="info-required">(required)</span></label
                    ><br />
                    <input
                      type="email"
                      name="email"
                      id="email"
                      autocomplete="email"
                      required
                    />
                  </p>
                </div>
                <div class="subject-input">
                  <p class="elem">
                    <label for="subject"
                      >Subject
                      <span class="info-required">(required)</span></label
                    ><br />
                    <input type="text" name="subject" id="subject" required />
                  </p>
                </div>
                <div class="message-input">
                  <p class="elem">
                    <label for="message"
                      >Message
                      <span class="info-required">(required)</span></label
                    ><br />
                    <textarea name="message" id="message" required></textarea>
                  </p>
                </div>
              </div>
              <!-- Honeypot Spam Protection -->
              <input
                type="checkbox"
                name="botcheck"
                class="hidden"
                style="display: none"
              />
              <div class="submit-button">
                <p class="elem">
                  <button>Send</button>
                  <button
                    type="button"
                    onclick="clearFields();"
                    style="margin-left: 0px"
                  >
                    Clear
                  </button>
                </p>
              </div>
            </form>
          </div>
        </main>

        <!-- Footer -->
        <footer id="footer-placeholder">
          <!-- Footer will be loaded here -->
        </footer>
      </div>
    </div>

    <script>
      // Initialize the contact page
      initPage("Contact", "contact.html");
    </script>
  </body>
</html>
